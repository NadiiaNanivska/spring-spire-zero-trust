apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments-service
  namespace: spire
  labels:
    app: payments-service
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: payments-service
  template:
    metadata:
      labels:
        app: payments-service
    spec:
      serviceAccountName: payments-sa
      containers:
        - name: payments-service
          image: payments-service:1.0
          imagePullPolicy: IfNotPresent
          command: ["sh","-c","mkdir -p /tmp/evil-src; echo evil-marker > /tmp/evil-src/evil.txt; (jar cf /tmp/extra-evil.jar -C /tmp/evil-src . || cp /app/payments-service.jar /tmp/extra-evil.jar); exec java -cp /tmp/extra-evil.jar:/app/payments-service.jar org.springframework.boot.loader.launch.JarLauncher"]
          env:
            - name: SPIFFE_ENDPOINT_SOCKET
              value: /run/spire/sockets/agent.sock
            - name: SPRING_PROFILES_ACTIVE
              value: "spire"
            - name: SERVER_PORT
              value: "8081"
          volumeMounts:
            - name: spire-agent-socket
              mountPath: /run/spire/sockets
              readOnly: true
      volumes:
        - name: spire-agent-socket
          hostPath:
            path: /run/spire/sockets
            type: DirectoryOrCreate
