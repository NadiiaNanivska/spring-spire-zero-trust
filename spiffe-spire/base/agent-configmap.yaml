apiVersion: v1
kind: ConfigMap
metadata:
  name: spire-agent
  namespace: spire
data:
  agent.conf: |
    agent {
      data_dir = "/run/spire"
      log_level = "DEBUG"
      server_address = "spire-server"
      server_port = "8081"
      socket_path = "/run/spire/sockets/agent.sock"
      trust_bundle_path = "/run/spire/bundle/bundle.crt"
      trust_domain = "zerotrust.lab"
    }

    plugins {
      NodeAttestor "k8s_psat" {
        plugin_data {
          # NOTE: Change this to your cluster name
          cluster = "minikube"
        }
      }

      KeyManager "memory" {
        plugin_data {
        }
      }

      WorkloadAttestor "k8s" {
        plugin_data {
          # Defaults to the secure kubelet port by default.
          # Minikube does not have a cert in the cluster CA bundle that
          # can authenticate the kubelet cert, so skip validation.
          skip_kubelet_verification = true
          node_name_env = "MY_NODE_NAME"
        }
      }

      WorkloadAttestor "unix" {
          plugin_data {
          }
      }

      # External JVM integrity attestor.
      # plugin_cmd   — path inside the agent container (populated by the
      #                install-jvm-attestor init-container via the jvm-plugin volume).
      # plugin_checksum — SHA-256 of the binary, rewritten in place by
      #                   `make checksum-sync` (which `make dev` runs for you).
      #                   A stale value makes the agent refuse the plugin and exit.
      #
      # The plugin only COMPUTES the jar SHA-256 and emits it as a
      # jvm:jar_sha256=<hash> selector. It no longer compares against a reference
      # (no manifest / Artifactory lookup on the attestation hot path). The
      # expected hash is enforced by the SPIRE registration entry, which wsldev
      # populates from spiffe-spire/base/jvm-hashes-configmap.yaml at deploy time.
      WorkloadAttestor "jvm" {
        plugin_cmd      = "/opt/spire/plugins/jvm-attestor"
        plugin_checksum = "74e20eac2d65ab183068f7914dafde943db9a92d09e1474630c365a5e60ad1ec"
        plugin_data {
          block_on_attach_socket = true
        }
      }
    }

    health_checks {
      listener_enabled = true
      bind_address = "0.0.0.0"
      bind_port = "8080"
      live_path = "/live"
      ready_path = "/ready"
    }
    
    telemetry {
    Prometheus {
        host = "0.0.0.0"
        port = 8089
      }
    }
